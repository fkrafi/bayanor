# BAYANOR — Jekyll Configuration
# UAE-based Premium Global Trading Company

title: "BAYANOR"
tagline: "Global Trade. Refined."
description: "UAE-based premium trading house specializing in import/export, B2B distribution, and licensed business activities across commerce, consulting, software, and trade services."
url: "https://fkrafi.github.io"
baseurl: "/bayanor"
lang: "en"

# Author / Company
author:
  name: "BAYANOR Trading"
  email: "info@bayanor.com"
  location: "Dubai, UAE"

# SEO & Open Graph
logo: "/assets/images/og-image.png"
og_image: "/assets/images/og-image.png"
twitter:
  username: bayanor

# Build settings
markdown: kramdown
highlighter: rouge
theme: null
permalink: pretty

# Sass
sass:
  sass_dir: assets/css
  style: compressed

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Navigation
nav_links:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about/"
  - title: "Business Activities"
    url: "/products/"
  - title: "Contact"
    url: "/contact/"

# Business Categories
categories:
  - name: "E-Commerce"
    icon: "✦"
    description: "Online buying and selling operations across digital channels."
  - name: "E-Commerce Through Social Media"
    icon: "✦"
    description: "Commercial social account operations under an existing license."
  - name: "General Trading"
    icon: "✦"
    description: "Importing, trading, and re-exporting approved goods and products."
  - name: "General Trading Import & Export"
    icon: "✦"
    description: "Broad trading operations excluding restricted categories."
  - name: "Human Resources Consultancy"
    icon: "✦"
    description: "Workforce planning, advisory, and performance improvement support."
  - name: "Events Organizing & Managing"
    icon: "✦"
    description: "Planning and managing event logistics and execution."
  - name: "Software Development Services"
    icon: "✦"
    description: "Design, implementation, operation, and maintenance of software systems."
  - name: "Innovation Startup"
    icon: "✦"
    description: "Novel product and technology development for growth markets."
  - name: "Branding Services"
    icon: "✦"
    description: "Brand strategy and corporate identity design services."
  - name: "Foodstuff Trading Import & Export"
    icon: "✦"
    description: "Wholesale trading of canned and preserved food products."
