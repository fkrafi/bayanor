<!-- BAYANOR — Premium Sticky Navbar -->
<header class="navbar" id="navbar" role="banner">
  <div class="container">
    <nav class="navbar__inner" aria-label="Main navigation">

      <!-- Wordmark -->
      <a href="{{ site.baseurl }}/" class="navbar__logo" aria-label="{{ site.title }} — Home">
        <span class="navbar__logo-text">BAYANOR</span>
        <span class="navbar__logo-tagline">GLOBAL TRADE</span>
      </a>

      <!-- Desktop Navigation -->
      <ul class="navbar__links" role="list">
        <li><a href="{{ site.baseurl }}/" class="navbar__link {% if page.url == '/' %}is-active{% endif %}">Home</a></li>
        <li><a href="{{ site.baseurl }}/about/" class="navbar__link {% if page.url contains '/about' %}is-active{% endif %}">About</a></li>
        <li><a href="{{ site.baseurl }}/#services" class="navbar__link">Services</a></li>
        <li><a href="{{ site.baseurl }}/#why-us" class="navbar__link">Why Us</a></li>
        <li><a href="{{ site.baseurl }}/contact/" class="navbar__link {% if page.url contains '/contact' %}is-active{% endif %}">Contact</a></li>
      </ul>

      <!-- Right Actions -->
      <div class="navbar__actions">
        <!-- Dark/Light Toggle -->
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle colour theme" title="Toggle theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- CTA Button -->
        <a href="{{ site.baseurl }}/contact/" class="btn btn--gold btn--sm">Enquire Now</a>

        <!-- Mobile Menu Toggle -->
        <button class="navbar__hamburger" id="menu-toggle" aria-label="Toggle mobile menu" aria-expanded="false" aria-controls="mobile-menu">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>

    </nav>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" id="mobile-menu" role="dialog" aria-label="Mobile navigation" aria-hidden="true">
    <ul class="mobile-menu__links" role="list">
      <li><a href="{{ site.baseurl }}/" class="mobile-menu__link">Home</a></li>
      <li><a href="{{ site.baseurl }}/about/" class="mobile-menu__link">About</a></li>
      <li><a href="{{ site.baseurl }}/#services" class="mobile-menu__link">Services</a></li>
      <li><a href="{{ site.baseurl }}/#why-us" class="mobile-menu__link">Why Us</a></li>
      <li><a href="{{ site.baseurl }}/contact/" class="mobile-menu__link">Contact</a></li>
      <li><a href="{{ site.baseurl }}/contact/" class="btn btn--gold btn--full">Enquire Now</a></li>
    </ul>
  </div>
</header>
