<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Primary Meta -->
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="keywords" content="UAE trading company, global trade, import export UAE, B2B distribution, premium trading, BAYANOR" />
  <meta name="author" content="{{ site.author.name }}" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}" />
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}" />
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/logo.jpeg" />
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ site.title }} | {{ site.tagline }}" />
  <meta name="twitter:description" content="{{ site.description }}" />
  <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/logo.jpeg" />

  <!-- Canonical -->
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/images/favicon.png" />

  <!-- PWA Support -->
  <meta name="theme-color" content="#B59B6A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="{{ site.title }}" />
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/images/apple-touch-icon.png" />
  <link rel="manifest" href="{{ site.baseurl }}/manifest.json" />

  <!-- Google Fonts — Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />

  <!-- Jekyll SEO Tag -->
  {% seo %}
</head>
<body>

  <!-- Skip to main content (accessibility) -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Navbar -->
  {% include navbar.html %}

  <!-- Main Content -->
  <main id="main-content">
    {{ content }}
  </main>

  <!-- Footer -->
  {% include footer.html %}

  <!-- Under Construction Banner -->
  <output class="construction-banner" aria-live="polite">
    <p>This is a demo website. We are still under construction.</p>
  </output>

  <!-- WhatsApp Chat -->
  <a id="whatsapp-chat" href="https://wa.me/971000000000" aria-label="Chat on WhatsApp" title="Chat on WhatsApp" rel="noopener noreferrer" target="_blank">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.52 3.48A11.82 11.82 0 0 0 12.08 0C5.51 0 .16 5.35.16 11.92c0 2.1.55 4.15 1.59 5.95L0 24l6.3-1.66a11.87 11.87 0 0 0 5.78 1.48h.01c6.57 0 11.92-5.35 11.92-11.92a11.82 11.82 0 0 0-3.49-8.42Z" stroke="none" fill="currentColor"></path>
      <path d="M17.07 14.37c-.27-.13-1.58-.78-1.82-.86-.24-.09-.42-.13-.6.14-.18.27-.68.86-.84 1.04-.15.18-.31.2-.58.07-.27-.13-1.14-.42-2.17-1.35-.81-.72-1.36-1.62-1.52-1.89-.16-.27-.02-.42.11-.56.12-.12.27-.31.4-.47.13-.15.18-.27.27-.45.09-.18.04-.34-.02-.47-.07-.13-.6-1.45-.82-1.98-.22-.53-.44-.46-.6-.46h-.51c-.18 0-.47.07-.71.34-.24.27-.92.9-.92 2.2 0 1.3.95 2.56 1.09 2.73.13.18 1.87 2.85 4.53 3.99.63.27 1.13.43 1.52.55.64.2 1.23.17 1.69.1.52-.08 1.58-.65 1.81-1.27.22-.62.22-1.15.16-1.27-.07-.11-.24-.18-.51-.31Z" stroke="none" fill="var(--color-white)"></path>
    </svg>
  </a>

  <!-- Back to Top -->
  <button id="back-to-top" aria-label="Back to top" title="Back to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <!-- Scripts -->
  <script src="{{ site.baseurl }}/assets/js/script.js" defer></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('{{ site.baseurl }}/service-worker.js', {
          scope: '{{ site.baseurl }}/'
        }).then((registration) => {
          console.log('Service Worker registered:', registration);
        }).catch((error) => {
          console.log('Service Worker registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>
