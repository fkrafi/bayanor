<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Primary Meta -->
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="keywords" content="Dubai trading company, UAE import export, B2B trading services, e-commerce UAE, social commerce, general trading, business consultancy Dubai, BAYANOR" />
  <meta name="author" content="{{ site.author.name }}" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}" />
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:image" content="{{ page.og_image | default: site.og_image | absolute_url }}" />
  <meta property="og:image:alt" content="{{ site.title }} — {{ site.tagline }}" />
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}" />
  <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="twitter:image" content="{{ page.og_image | default: site.og_image | absolute_url }}" />
  <meta name="twitter:image:alt" content="{{ site.title }} — {{ site.tagline }}" />

  <!-- Canonical -->
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon.png' | relative_url }}" />

  <!-- PWA Support -->
  <meta name="theme-color" content="#B59B6A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="{{ site.title }}" />
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}" />
  <link rel="manifest" href="{{ '/manifest.json' | relative_url }}" />

  <!-- Google Fonts — Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />

  <!-- Jekyll SEO Tag -->
  {% seo %}

  <!-- Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "{{ site.title }}",
      "url": "{{ '/' | absolute_url }}",
      "logo": "{{ site.logo | absolute_url }}",
      "description": "{{ site.description }}",
      "email": "{{ site.author.email }}",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Dubai",
        "addressCountry": "AE"
      }
    }
  </script>
</head>
<body>

  <!-- Skip to main content (accessibility) -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Navbar -->
  {% include navbar.html %}

  <!-- Main Content -->
  <main id="main-content">
    {{ content }}
  </main>

  <!-- Footer -->
  {% include footer.html %}

  <!-- Under Construction Banner -->
  <output class="construction-banner" aria-live="polite">
    <p>This is a demo website. We are still under construction.</p>
  </output>

  <!-- WhatsApp Chat -->
  <a id="whatsapp-chat" href="https://wa.me/971000000000" aria-label="Chat on WhatsApp" title="Chat on WhatsApp" rel="noopener noreferrer" target="_blank">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M13.601 2.326A7.853 7.853 0 0 0 8.012 0C3.66 0 .117 3.52.117 7.852c0 1.386.364 2.738 1.055 3.93L0 16l4.32-1.132a7.9 7.9 0 0 0 3.692.94h.003c4.352 0 7.894-3.52 7.894-7.852a7.8 7.8 0 0 0-2.308-5.63zM8.015 14.552h-.002a6.6 6.6 0 0 1-3.35-.92l-.24-.142-2.563.672.683-2.498-.157-.256a6.56 6.56 0 0 1-1.014-3.556c0-3.61 2.95-6.547 6.577-6.547 1.756 0 3.406.68 4.646 1.913a6.5 6.5 0 0 1 1.931 4.634c-.001 3.61-2.952 6.547-6.58 6.547zm3.6-4.95c-.196-.098-1.159-.57-1.338-.634-.18-.066-.312-.098-.443.098-.131.195-.508.634-.623.764-.114.13-.229.147-.425.049-.195-.098-.825-.303-1.572-.967-.58-.513-.971-1.147-1.085-1.343-.114-.195-.012-.301.086-.398.088-.087.196-.228.294-.341.098-.114.13-.195.196-.326.065-.13.033-.245-.016-.342-.049-.098-.443-1.064-.607-1.456-.16-.384-.323-.331-.442-.337l-.377-.007c-.131 0-.344.049-.524.244-.179.196-.688.667-.688 1.626 0 .96.704 1.887.802 2.018.098.13 1.383 2.106 3.352 2.953.468.202.833.322 1.117.413.468.148.894.127 1.231.077.376-.056 1.159-.473 1.322-.93.164-.457.164-.849.115-.93-.049-.081-.18-.13-.376-.228z"/>
    </svg>
  </a>

  <!-- Back to Top -->
  <button id="back-to-top" aria-label="Back to top" title="Back to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <!-- Scripts -->
  <script src="{{ '/assets/js/script.js' | relative_url }}" defer></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('{{ '/service-worker.js' | relative_url }}', {
          scope: '{{ '/' | relative_url }}'
        }).then((registration) => {
          console.log('Service Worker registered:', registration);
        }).catch((error) => {
          console.log('Service Worker registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>
